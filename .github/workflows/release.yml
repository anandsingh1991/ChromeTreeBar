name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create extension package
        run: |
          zip -r chromebar-${{ steps.version.outputs.version }}.zip . \
            -x "*.git*" "*.zip" "*node_modules*" "*.DS_Store" \
            "*PUBLISHING_GUIDE.md" "*PERMISSION_JUSTIFICATIONS.md" \
            "*STORE_DESCRIPTION.md" "*FEATURES_DOCUMENTATION.md"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: chromebar-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
